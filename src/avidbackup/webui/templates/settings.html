{% extends "base.html" %}
{% block title %}Settings · {{ brand }}{% endblock %}
{% block body %}
  <h1>Retention &amp; paths</h1>
  <p class="muted">Defaults for new accounts. Each account can override MySQL retention on its edit page.</p>
  <form method="post" class="card" style="margin-top:1rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Data root (where backups are stored)</label>
    <input name="data_root" value="{{ cfg.data_root }}" placeholder="~/avidbackup-data or absolute path">

    <div class="row">
      <div>
        <label>Default MySQL retention (days)</label>
        <input type="number" min="1" name="mysql_retention_days" value="{{ cfg.mysql_retention_days }}">
      </div>
      <div>
        <label>Large table flag (MB)</label>
        <input type="number" min="1" step="1" name="large_table_mb" value="{{ cfg.large_table_mb }}">
      </div>
      <div>
        <label>Download retries</label>
        <input type="number" min="1" max="10" name="download_retries" value="{{ cfg.download_retries }}">
      </div>
    </div>

    <label class="check"><input type="checkbox" name="files_keep_forever" {% if cfg.files_keep_forever %}checked{% endif %}> Keep website files forever (recommended)</label>

    <div class="row">
      <div>
        <label>UI host</label>
        <input name="ui_host" value="{{ cfg.ui_host }}">
        <div class="hint">Non-loopback requires UI token / AVIDBACKUP_UI_TOKEN.</div>
      </div>
      <div>
        <label>UI port</label>
        <input type="number" name="ui_port" value="{{ cfg.ui_port }}">
      </div>
      <div>
        <label>UI token <span class="muted">(blank = keep)</span></label>
        <input type="password" name="ui_token" value="" autocomplete="new-password" placeholder="••••">
      </div>
      <div>
        <label>Dump compression default</label>
        <select name="compress_dumps">
          <option value="gzip" {% if cfg.compress_dumps=='gzip' %}selected{% endif %}>gzip</option>
          <option value="none" {% if cfg.compress_dumps=='none' %}selected{% endif %}>none</option>
        </select>
      </div>
    </div>

    <h2>Optional notifications</h2>
    <label>Webhook URL (JSON POST on success)</label>
    <input name="webhook_url" value="{{ cfg.notify.webhook_url }}">
    <label>Webhook secret / Bearer <span class="muted">(blank = keep)</span></label>
    <input type="password" name="webhook_secret" value="" autocomplete="new-password" placeholder="••••">
    <div class="row">
      <div><label>SMTP host</label><input name="smtp_host" value="{{ cfg.notify.smtp_host }}"></div>
      <div><label>SMTP port</label><input type="number" name="smtp_port" value="{{ cfg.notify.smtp_port }}"></div>
      <div><label>SMTP user</label><input name="smtp_user" value="{{ cfg.notify.smtp_user }}"></div>
      <div><label>SMTP password <span class="muted">(blank = keep)</span></label><input type="password" name="smtp_password" value="" autocomplete="new-password" placeholder="••••"></div>
    </div>
    <div class="row">
      <div><label>From</label><input name="smtp_from" value="{{ cfg.notify.smtp_from }}"></div>
      <div><label>To</label><input name="smtp_to" value="{{ cfg.notify.smtp_to }}"></div>
    </div>

    <p style="margin-top:1.25rem;">
      <button class="btn btn-primary" type="submit">Save settings</button>
    </p>
  </form>
{% endblock %}
