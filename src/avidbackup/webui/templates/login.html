{% extends "base.html" %}
{% block title %}Sign in · {{ brand }}{% endblock %}
{% block body %}
  <h1>Sign in</h1>
  <p class="muted">AvidBackup needs a sign-in token. Run <code>avidbackup token</code> to print it, or open the sign-in link from the app or tray.</p>
  <form method="post" action="{{ url_for('login_submit') }}" class="card" style="margin-top:1rem;max-width:420px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Token</label>
    <input id="token" type="password" name="token" required autocomplete="current-password">
    <p style="margin-top:1rem;"><button class="btn btn-primary" type="submit">Sign in</button></p>
  </form>
  <script>
    // Sign-in links carry the token in the URL fragment (#t=...), which browsers never send to
    // the server or write to logs. Fill the form from it, clear it from the address bar, submit.
    (function () {
      var m = location.hash.match(/^#t=(.+)$/);
      if (!m) return;
      var form = document.querySelector('form[action$="/login"]');
      if (!form) return;
      form.querySelector('input[name=token]').value = decodeURIComponent(m[1]);
      history.replaceState(null, '', location.pathname + location.search);
      form.submit();
    })();
  </script>
{% endblock %}
