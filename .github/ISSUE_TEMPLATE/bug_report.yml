name: Bug report
description: Report a bug in AvidBackup
body:
  - type: input
    id: version
    attributes:
      label: AvidBackup version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: markdown
    attributes:
      value: "Do **not** paste real passwords, tokens, or private client data."
